name: Feature request
description: Propose a capability mcp4vertx does not have yet.
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: >-
        Describe the situation you are in, not the API you have in mind. The
        underlying problem usually admits a better solution than the one that
        first comes to mind.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: If you have a concrete API in mind, sketch it here.
      render: java

  - type: input
    id: spec
    attributes:
      label: Related MCP specification section
      description: >-
        If this tracks part of the Model Context Protocol specification, link it.
        mcp4vertx aims to follow the spec rather than invent alongside it.
      placeholder: 'https://modelcontextprotocol.io/specification/...'

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Including any workaround you are using today.
